# Set VTOR to app vector table before jumping (required for chain-load)
CONFIG_BOOT_INTR_VEC_RELOC=y

# PSE84 flash write alignment exceeds the 32-byte maximum that MCUBoot's
# SWAP upgrade modes support. Use overwrite-only mode instead.
CONFIG_BOOT_UPGRADE_ONLY=y

# No image signature verification by default.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Must be large enough to cover the slot size divided by the flash
# erase-block size. 256 covers the default slots with 64 KB erase blocks.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# MCUBoot must configure and initialize SMIF HW for subsequent slots
# in external flash to operate correctly.
CONFIG_FLASH_INFINEON_SMIF_HW_INIT=y

# Multi-image: validate SPE (image 0, slot0/slot1) and NSPE
# (image 1, slot2/slot3) independently. Allows OTA of either
# half without re-signing the other.
CONFIG_UPDATEABLE_IMAGE_NUMBER=3

# ---------------------------------------------------------------------------
# Serial UART DFU via SCB1 (P9.2 TX / P9.3 RX)
#
# Enables MCUBoot serial recovery so that new images can be uploaded over
# the SCB1 UART (labeled uart1 in the DTS) using mcumgr or imgtool.
# The recovery UART is chosen via the "zephyr,uart-mcumgr" selected node.
# See kit_pse84_eval_mcuboot_bl.overlay for the SCB1 pin and clock setup.
# ---------------------------------------------------------------------------

# Enable MCUBoot serial recovery subsystem (selects UART_INTERRUPT_DRIVEN).
CONFIG_MCUBOOT_SERIAL=y

# Use UART transport (not CDC-ACM).
CONFIG_BOOT_SERIAL_UART=y

# Enter serial recovery mode when the user button (SW_1 / P8.3) is held
# low at reset.  The DTS node "sw0" already resolves to that GPIO.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
# Allow 100 ms for the GPIO pull-up to stabilize before sampling P8.3.
CONFIG_BOOT_SERIAL_DETECT_DELAY=100

# Increase serial receive buffer to handle large SMP upload frames.
# Default BOOT_LINE_BUFS=8 gives 1024 bytes (8 x 128); 16 gives 2048 bytes.
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=2048
