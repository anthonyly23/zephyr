# USB device-next stack
CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_STDOUT_CONSOLE=y

# Logging (errors only -> minimal overhead in the data path)
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# UDC buffer pool: 4 x 16 KiB IN transfers + headroom.
CONFIG_UDC_BUF_COUNT=32
CONFIG_UDC_BUF_POOL_SIZE=81920

# Place UDC buffers in non-cached SRAM so the driver does not have to flush
# the data cache on every IN transfer (huge throughput win on M55).
CONFIG_NOCACHE_MEMORY=y
CONFIG_UDC_BUF_FORCE_NOCACHE=y

# Sample app options
CONFIG_APP_VENDOR_BULK_PRODUCER=y
CONFIG_APP_VENDOR_BULK_XFER_SIZE=32768
CONFIG_APP_VENDOR_BULK_IN_DEPTH=2

# Vendor / Product (Zephyr project IDs - do NOT ship outside samples)
CONFIG_SAMPLE_USBD_VID=0x2fe3
CONFIG_SAMPLE_USBD_PID=0x000a
CONFIG_SAMPLE_USBD_PRODUCT="Zephyr vendor bulk sample"

# Disable the CDC ACM serial-at-boot helper that some boards default-enable.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
